name: Build 5G Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 5G-AutoSwitcher-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.1.3
          name: "5G NR 1-Second Auto-Switcher v2.1.3"
          body: |
            ## ⚡ 5G NR 1-Second Auto-Switcher v2.1.3
            - **Vivo OriginOS / FuntouchOS Shizuku Automation Fixed**:
              - Direct AOSP `cmd phone set-allowed-network-types-for-users` execution for instant background modem switching.
              - Unblocks Android hidden API policy dynamically (`hidden_api_policy 1`) for elevated telephony access.
              - Resolves active multi-SIM `subId`s dynamically via `SubscriptionManager`.
              - Uses privileged `com.android.shell` (UID 2000) for native `ITelephony` Binder transactions.
              - Multi-SIM and OEM global settings synchronization.
            - **Universal Package Support**: Supports Vivo, Xiaomi, Oppo, OnePlus, and Samsung dialer testing menus.
            - **1-Tap Enable Accessibility via Shizuku**: Auto-grants accessibility permissions silently.
            - **Specific Engine Selector**: Auto (Smart Fallback), Shizuku Only (Pure Background), or Accessibility Only (1-Sec UI).
            
            ### 📲 Installation:
            Download `app-debug.apk` below and open it on your Android phone!
          files: |
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
