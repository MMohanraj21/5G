name: Build 5G Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 5G-AutoSwitcher-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.1.0
          name: "5G NR 1-Second Auto-Switcher v2.1.0"
          body: |
            ## ⚡ 5G NR 1-Second Auto-Switcher v2.1.0 (Shizuku & Dual Engine)
            - **Shizuku Silent Engine (New)**: 50ms invisible background switching without opening RadioInfo!
            - **Specific Engine Chooser (New)**: Choose between Auto (Smart Fallback), Shizuku Only, or Accessibility Only.
            - **Accessibility Service Engine**: 1-Second automated RadioInfo switcher for phones without Shizuku.
            - **1-Tap Quick Settings Tile**: Silent background toggle with Shizuku support.
            - **Jetpack Compose Material 3 Dynamic Colors** (Android 10 - 14 / API 29 - 34).
            
            ### 📲 Installation:
            Download `app-debug.apk` below and open it on your Android phone!
          files: |
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
